<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Dark Sky Holiday</title>
<meta name="application-name" content="Our Dark Sky Holiday">
<meta name="description" content="Getting to the Dark Sky, your day in the Warrumbungles, at your lodge and night at Dark Sky Eco.">
<meta name="theme-color" content="#0B1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holiday">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./favicon.svg">
<style>
  html,body{margin:0;height:100%;background:#0B1520;color:#f3efe4;font-family:Figtree,system-ui,sans-serif}
  .bar{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;gap:10px;align-items:center;padding:8px 14px;background:#0B1520e6;backdrop-filter:blur(8px);font-size:13px}
  .bar img{width:28px;height:28px;border-radius:6px;background:#fff;flex:0 0 auto}
  .bar b{letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  .bar span{opacity:.85}
  .bar button{color:#e8d5a3;margin-left:auto;background:none;border:0;font:inherit;cursor:pointer}
  iframe{position:fixed;inset:44px 0 0 0;width:100%;height:calc(100% - 44px);border:0;background:#0B1520}
  .note{position:fixed;inset:44px 16px auto 16px;font-size:14px;line-height:1.5;color:#c9c2b4}
</style>
</head>
<body>
  <div class="bar">
    <img src="./favicon.svg" width="28" height="28" alt="Dark Sky Eco Retreat">
    <b>Our Dark Sky Holiday</b>
    <span>Dark Sky Eco</span>
    <button type="button" id="fullBtn">Open full screen</button>
  </div>
  <p class="note">Loading Our Dark Sky Holiday.</p>
  <iframe id="skyFrame" title="Our Dark Sky Holiday" src="https://shale-sapphire-falcon-mint.grok.me/?v=20260913-pass3" allow="geolocation; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    document.getElementById('fullBtn').addEventListener('click', function () {
      var frame = document.getElementById('skyFrame');
      if (frame.requestFullscreen) frame.requestFullscreen();
      else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
